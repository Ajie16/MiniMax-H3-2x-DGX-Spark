name: Public audit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Audit tracked content and syntax
        run: ./scripts/public-audit.sh
      - name: ShellCheck
        run: >-
          docker run --rm --entrypoint shellcheck
          -v "$PWD:/mnt:ro" -w /mnt
          koalaman/shellcheck-alpine@sha256:5921d946dac740cbeec2fb1c898747b6105e585130cc7f0602eec9a10f7ddb63
          -x -P scripts scripts/*.sh
